[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GP_TDX"
version = "0.1.0"
description = "Update and upload TDX data (quote, CW, dividend, stockinfo) to MongoDB"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pymongo",
    "pytdx",
    "tqdm",
    "pypinyin",
    "dbfread",
]

[project.scripts]
gp-tdx = "GP_TDX.__main__:main"

[tool.setuptools]
packages = ["GP_TDX"]

[tool.setuptools.package-dir]
GP_TDX = "."

[tool.setuptools.package-data]
GP_TDX = ["*.ipynb"]
